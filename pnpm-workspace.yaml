packages:
  - apps/*
  - libraries/*
  - tests/*

# Postinstall scripts are blocked unless allowed here. The allowed packages
# compile or download native binaries they cannot work without.
allowBuilds:
  '@2060.io/ffi-napi': true
  '@2060.io/ref-napi': true
  '@hyperledger/aries-askar-nodejs': true
  '@nestjs/core': true
  '@scarf/scarf': false
  '@sphereon/pex': false
  es5-ext: false
  sqlite3: true

# Shared dependency versions (replaces Rush's ensureConsistentVersions).
# Reference these from package.json with the "catalog:" protocol.
catalog:
  '@credo-ts/askar': 0.5.10
  '@credo-ts/core': 0.5.10
  '@credo-ts/node': 0.5.10
  '@energyweb/eslint-config': ~0.1.0
  '@energyweb/prettier-config': ~0.0.1
  '@hyperledger/aries-askar-nodejs': ^0.2.1
  '@nestjs/common': ^10.0.4
  '@nestjs/core': ^10.0.4
  '@nestjs/platform-express': ^10.0.4
  '@nestjs/testing': ^10.0.4
  '@types/jest': ^29.5.2
  '@types/supertest': ^2.0.12
  '@typescript-eslint/eslint-plugin': ^5.60.1
  '@typescript-eslint/parser': ^5.60.1
  did-resolver: ~4.1.0
  eslint: ^8.22.0
  eslint-config-prettier: ^8.8.0
  eslint-plugin-no-only-tests: ~3.1.0
  eslint-plugin-prettier: ^4.2.1
  ethers: 6.6.2
  jest: ^29.5.0
  jose: ^4.14.4
  prettier: ^2.8.8
  reflect-metadata: ^0.1.13
  rimraf: ^4.0.0
  supertest: ^6.3.3
  ts-jest: ^29.1.1
  ts-loader: ^9.4.4
  ts-node: ^10.9.1
  tsconfig-paths: ^4.2.0
  typescript: ^4.8.0

# Newer versions of these transitive dependencies publish type declarations
# that require TypeScript >= 5 ("exports" subpath resolution). Pinned until
# the TypeScript upgrade; remove the overrides afterwards.
overrides:
  '@peculiar/asn1-schema': 2.3.13
  webcrypto-core: 1.8.0
  # Align every consumer on one class-validator instance (also credo-ts's pin);
  # 0.14.2+ changed nested validation behaviour and breaks DTO validation.
  class-validator: 0.14.1
  # Single reflect-metadata instance; auto-installed peers otherwise resolve
  # 0.2.x alongside the app's 0.1.x and split @nestjs/core into two instances.
  reflect-metadata: ~0.1.14

patchedDependencies:
  '@credo-ts/core@0.5.10': patches/@credo-ts__core@0.5.10.patch
