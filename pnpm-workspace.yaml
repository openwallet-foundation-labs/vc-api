packages:
  - apps/*
  - libraries/*
  - tests/*

# Postinstall scripts are blocked unless allowed here. The allowed packages
# compile or download native binaries they cannot work without.
allowBuilds:
  '@openwallet-foundation/askar-nodejs': true
  '@nestjs/core': true
  '@scarf/scarf': false
  es5-ext: false
  sqlite3: true
  unrs-resolver: true
  cbor-extract: true
  koffi: true

# Shared dependency versions (replaces Rush's ensureConsistentVersions).
# Reference these from package.json with the "catalog:" protocol.
catalog:
  '@animo-id/pex': ^6.1.1
  '@credo-ts/askar': ^0.7.0
  '@credo-ts/core': ^0.7.0
  '@credo-ts/node': ^0.7.0
  '@openwallet-foundation/askar-nodejs': ^0.6.0
  '@openwallet-foundation/askar-shared': ^0.6.0
  '@sphereon/pex-models': ^2.3.2
  '@sphereon/ssi-types': 0.33.0
  '@nestjs/common': ^11.1.0
  '@nestjs/core': ^11.1.0
  '@nestjs/platform-express': ^11.1.0
  '@nestjs/testing': ^11.1.0
  '@types/jest': ^30.0.0
  '@types/node': ^24.0.0
  '@types/supertest': ^7.0.0
  cross-env: ^10.0.0
  did-resolver: ~4.1.0
  eslint: ^10.0.0
  globals: ^16.0.0
  eslint-config-prettier: ^10.0.0
  eslint-plugin-no-only-tests: ^3.3.0
  ethers: 6.6.2
  jest: ^30.4.0
  jose: ^4.14.4
  prettier: ^3.9.0
  reflect-metadata: ^0.2.2
  rimraf: ^4.0.0
  supertest: ^7.0.0
  ts-jest: ^29.4.0
  ts-loader: ^9.4.4
  ts-node: ^10.9.1
  tsconfig-paths: ^4.2.0
  typescript: ^5.9.0
  typescript-eslint: ^8.62.0

overrides:
  # Align every consumer on one class-validator instance (also credo-ts's pin);
  # 0.14.2+ changed nested validation behaviour and breaks DTO validation.
  class-validator: 0.14.1

patchedDependencies:
  '@credo-ts/core@0.7.0': patches/@credo-ts__core@0.7.0.patch
